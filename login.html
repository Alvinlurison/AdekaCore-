<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – AdekaCore</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#00d4ff" />
  <link rel="apple-touch-icon" href="logo.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #050505;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #0a1a2a 0%, #050505 70%);
    }
    .login-box {
      background: #0c0c0c;
      border: 1px solid #1f1f1f;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    .logo span { color: #00d4ff; }
    .subtitle {
      color: #888;
      margin-bottom: 2.5rem;
      font-size: 0.95rem;
    }
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      background: #fff;
      color: #333;
      border: none;
      padding: 0.9rem 1.5rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .google-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255,255,255,0.15);
    }
    .google-btn img {
      width: 22px;
      height: 22px;
    }
    .divider {
      margin: 1.8rem 0;
      color: #444;
      font-size: 0.85rem;
    }
    .back-link {
      display: inline-block;
      margin-top: 2rem;
      color: #00d4ff;
      font-size: 0.9rem;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
    .error {
      background: #2a0a0a;
      color: #ff6b6b;
      padding: 0.8rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="logo">Adeka<span>Core</span></div>
    <p class="subtitle">Sign in to access your member workspace</p>

    <div class="error" id="errorBox"></div>

    <button class="google-btn" onclick="signInWithGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
      Continue with Google
    </button>

    <div class="divider">Members only</div>

    <a href="index.html" class="back-link">← Back to AdekaCore</a>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    // Check if already logged in
    auth.onAuthStateChanged(user => {
      if (user) {
        window.location.href = "workspace.html";
      }
    });

    function signInWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then(result => {
          // Successfully signed in
          window.location.href = "workspace.html";
        })
        .catch(error => {
          const errorBox = document.getElementById("errorBox");
          errorBox.style.display = "block";
          errorBox.textContent = error.message;
        });
    }
  </script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>
